<!-- GD Remote Upload Front-End
---- Remote-Upload to Google Drive using Google Apps Script.
---- https://github.com/AlirezaM1376/GDRemoteUpload
!-->

 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple GD Remote Upload</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #4a90e2;
      --primary-hover: #357abd;
      --border-color: #ddd;
      --input-bg: #fff;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      --transition: all 0.3s ease;
    }

    [data-theme="dark"] {
      --bg-color: #1a1a1a;
      --card-bg: #2d2d2d;
      --text-color: #e0e0e0;
      --primary-color: #5dade2;
      --primary-hover: #3498db;
      --border-color: #444;
      --input-bg: #3d3d3d;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tahoma', 'Segoe UI', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      transition: var(--transition);
    }

    .container {
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 15px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 500px;
      transition: var(--transition);
      position: relative;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .header h2 {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.5rem;
      color: var(--text-color);
      padding: 5px;
      border-radius: 50%;
      transition: var(--transition);
    }

    .theme-toggle:hover {
      background-color: rgba(0,0,0,0.05);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .required::after {
      content: " *";
      color: #e74c3c;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--input-bg);
      color: var(--text-color);
      font-size: 1rem;
      transition: var(--transition);
      outline: none;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .hint {
      font-size: 0.8rem;
      color: #888;
      margin-top: 5px;
    }

    button.submit-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: var(--transition);
    }

    button.submit-btn:hover {
      background-color: var(--primary-hover);
    }

    button.submit-btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background-color: rgba(74, 144, 226, 0.1);
      border: 1px solid var(--primary-color);
      display: none;
      text-align: center;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 10px;
      color: var(--primary-color);
    }

    .footer {
      margin-top: 30px;
      text-align: center;
      font-size: 0.85rem;
      border-top: 1px solid var(--border-color);
      padding-top: 15px;
    }

    .footer a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: bold;
    }

    #result a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: bold;
    }

    #result a:hover {
      text-decoration: underline;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
      .container {
        padding: 20px;
      }
      .header h2 {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Google Drive Remote Upload</h2>
      <button class="theme-toggle" id="themeBtn" title="Change Theme">🌙</button>
    </div>

    <form id="fileForm">
      <div class="form-group">
        <label for="fileLink" class="required">File link</label>
        <textarea id="fileLink" name="fileLink" placeholder="Enter the direct link of the file here..." required></textarea>
        <div class="hint">Mandatory</div>
      </div>

      <div class="form-group">
        <label for="fileName">File name (Save as)</label>
        <input type="text" id="fileName" name="fileName" placeholder="Leave empty to use the default file name">
        <div class="hint">Optional</div>
      </div>

      <div class="form-group">
        <label for="folderId">Save to folder in Google Drive</label>
        <input type="text" id="folderId" name="folderId" placeholder="Enter folder ID or leave empty to upload in root">
        <div class="hint">Optional</div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Upload</button>
    </form>

    <div id="loading" class="loading">Please wait...</div>
    <div id="result"></div>

    <div class="footer">
      <p>Created by <strong><a href="https://t.me/ComedyElahi" target="_blank">Alireza Elahi</a></strong></p>
      <p style="margin-top: 5px; font-size: 0.75rem; opacity: 0.7;"><strong><a href="https://github.com/AlirezaM1376/GDRemoteUpload" target="_blank">Check the project in GitHub</a></strong></p>
    </div>
  </div>

  <script>
    
    const themeBtn = document.getElementById('themeBtn');
    const body = document.body;
    
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      body.setAttribute('data-theme', savedTheme);
      updateThemeIcon(savedTheme);
    }

    themeBtn.addEventListener('click', () => {
      const currentTheme = body.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      body.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeIcon(newTheme);
    });

    function updateThemeIcon(theme) {
      themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
    }

    const form = document.getElementById('fileForm');
    const submitBtn = document.getElementById('submitBtn');
    const loadingDiv = document.getElementById('loading');
    const resultDiv = document.getElementById('result');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
    
      submitBtn.disabled = true;
      submitBtn.textContent = 'Uploading';
      loadingDiv.style.display = 'block';
      resultDiv.style.display = 'none';

      const fileLink = document.getElementById('fileLink').value.trim();
      const fileName = document.getElementById('fileName').value.trim();
      const folderId = document.getElementById('folderId').value.trim();

      google.script.run
        .withSuccessHandler((response) => {
          // موفقیت
          loadingDiv.style.display = 'none';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Upload';
          
          resultDiv.style.display = 'block';
          if(response.status=='success'){ 
            resultDiv.style.borderColor = '#4a90e2';
            resultDiv.style.backgroundColor = 'rgba(74, 144, 226, 0.1)';
            if(response.details.partsCount>1){
              resultDiv.innerHTML = `
                <strong>✅ ${response.message}</strong><br><br>
                <small>Download from folder: <a href="${response.details.link}" target="_blank" ><strong>${response.details.name}</strong></a></small><br>
                <small>Size: ${response.details.size}</small><br>
                <small>Parts count: ${response.details.partsCount} parts</small><br>
              `;
            }else{
              resultDiv.innerHTML = `
                <strong>✅ ${response.message}</strong><br><br>
                <small>Download Link: <a href="${response.details.link}" target="_blank" ><strong>${response.details.name}</strong></a></small><br>
                <small>Size: ${response.details.size}</small>
              `;
            }
          }
          else{
            resultDiv.style.borderColor = '#e74c3c';
            resultDiv.style.backgroundColor = 'rgba(231, 76, 60, 0.1)';
            resultDiv.innerHTML = `<strong>❌ Someting went wrong!</strong><br>${response.message}`;
          }
          
          form.reset();
        })
        .withFailureHandler((error) => {

          loadingDiv.style.display = 'none';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Upload';
          
          resultDiv.style.display = 'block';
          resultDiv.style.borderColor = '#e74c3c';
          resultDiv.style.backgroundColor = 'rgba(231, 76, 60, 0.1)';
          resultDiv.innerHTML = `<strong>❌ Someting went wrong!</strong><br>${error.message}`;
        })
        .processFile({ fileLink: fileLink, fileName: fileName, folderId: folderId });
    });
  </script>
</body>
</html>
